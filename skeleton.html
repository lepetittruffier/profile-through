  ════════════════════════════════════════════════════════════════════════════
  PROFILE, IN WIREFRAME
  Hägg · 2026 · Art Basel

  A code-native wireframed 3D portrait study — pure monochrome, 16:9, rendered
  live in the browser. Subject in 3/4 right-facing profile, hand-to-neck
  gesture, raw-knit garment, gallery void.

  Built across 10 iterative passes (visible in git history):
    01 · Armature             — block-in geometry, anchor on right third
    02 · Profile lock         — load-bearing silhouette + facial planes
    03 · Hair strands         — 60+ individual wet-spiky strand paths
    04 · Hand + neck gesture  — articulated fingers, knuckles, contact
    05 · Sweater topology     — knit rows + chevron stitches + raw cuff
    06 · Cross-contour depth  — 65 isolines wrapping every form (3D mesh)
    07 · Frame + composition  — floor, scale bar, datum, ⅓ line
    08 · Forensic annotations — 12 latin leader labels, edition stamp
    09 · Motion               — 6s breath cycle + cursor parallax + hair sway
    10 · Final · this file    — polish, accessibility, embed wrapper

  EMBED: paste this entire HTML document into a Figma Sites code block,
         or copy just the <svg> element below into any host. Standalone,
         no dependencies, no external assets.

  ACCESSIBILITY: prefers-reduced-motion honored. role="img" + aria-label.
                 <title>/<desc> inside SVG for screen readers.

  LAYER MAP (for editing — each is a top-level <g> in the SVG):
    #construction              — frame, corner crosses, axes, datum lines
    #composition-architecture  — title block, scale bar, dim callouts, void marks
    #figure-armature           — Pass 01 block-in (faded scaffold)
    #profile-lock              — Pass 02 silhouette + face details
    #hair-strands              — Pass 03 strand paths
    #hand-gesture              — Pass 04 articulated hand
    #sweater                   — Pass 05 knit + drape + cuff
    #depth-contours            — Pass 06 cross-contour isolines
    #forensic-annotations      — Pass 08 latin leaders + edition stamp
  ════════════════════════════════════════════════════════════════════════════
-->

  <desc id="art-desc">A code-native wireframed 3D anatomical portrait in pure monochrome. A young woman shown in three-quarter right-facing profile, wet-spiky shoulder-length hair, left hand crossed up to rest fingers on the right side of her neck. The clothing layer has been removed to reveal the underlying skeletal structure: sternum and manubrium at the central axis, paired clavicles spanning the shoulders, ribcage curving from spine to sternum, cervical vertebrae stacked through the neck, radius and ulna running through the forearm, phalanges visible inside the gesturing fingers. The figure is anchored to the right third of a 16:9 landscape canvas, set against a vast architectural void containing twelve latin-labeled anatomical leader lines, a scale bar, and an edition stamp. The composition breathes subtly via a 5-second sin-wave cycle and tilts its head toward the viewer's cursor position.</desc>

<!--
  ============================================================
  MOTION CONTROLLER  (Pass 09)
  Drives breath cycle + cursor parallax + hair micro-sway via rAF.
  Honors prefers-reduced-motion (returns early if user opted out).
  ============================================================
-->
<script>
(function () {
  'use strict';

  // Accessibility — honor user preference for reduced motion
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) return;

  // Element lookups — these are the motion targets
  var bodyIds  = ['figure-armature', 'depth-contours', 'hand-gesture', 'skeleton'];
  var headIds  = ['hair-envelope', 'head-armature', 'head-meridians',
                  'head-parallels', 'profile-lock', 'hair-strands'];
  var hairIds  = ['crown-spikes', 'top-back-fall', 'side-of-head',
                  'back-drop', 'forehead-wisps'];

  var bodyEls = bodyIds.map(function (id) { return document.getElementById(id); })
                       .filter(Boolean);
  var headEls = headIds.map(function (id) { return document.getElementById(id); })
                       .filter(Boolean);
  var hairEls = hairIds.map(function (id) { return document.getElementById(id); })
                       .filter(Boolean);

  // Cursor parallax target — head tilts ±1.5° based on horizontal mouse position
  var targetTilt = 0;
  var currentTilt = 0;

  document.addEventListener('mousemove', function (e) {
    var x = e.clientX / window.innerWidth - 0.5;  // -0.5 to +0.5
    targetTilt = x * 6;                            // ±3° head rotation
  });

  // Touch parallax — first touch position acts as cursor on mobile
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 0) {
      var x = e.touches[0].clientX / window.innerWidth - 0.5;
      targetTilt = x * 6;
    }
  }, { passive: true });

  var t0 = performance.now();

  function tick(now) {
    var t = (now - t0) / 1000; // elapsed seconds

    // Smooth lerp toward cursor target (~150ms time-constant)
    currentTilt += (targetTilt - currentTilt) * 0.08;

    // BREATH — 5-second sin cycle, ±1.5% scale, ±10% opacity drift
    // Visibly alive but still editorial; the figure clearly inhales/exhales.
    var breathPhase = (t / 5) * Math.PI * 2;
    var breathScale = 1 + 0.015 * Math.sin(breathPhase);
    var breathOpacity = 0.85 + 0.15 * (Math.sin(breathPhase) * 0.5 + 0.5);

    // BODY — uniform scale around chest pivot (1480, 540), opacity drift
    var bodyTransform = 'scale(' + breathScale.toFixed(5) + ')';
    var i;
    for (i = 0; i < bodyEls.length; i++) {
      bodyEls[i].style.transform = bodyTransform;
      bodyEls[i].style.opacity = breathOpacity.toFixed(3);
    }

    // HEAD — same breath scale + cursor-driven rotation around neck pivot (1480, 685)
    var headTransform = 'scale(' + breathScale.toFixed(5) + ') ' +
                        'rotate(' + currentTilt.toFixed(3) + 'deg)';
    for (i = 0; i < headEls.length; i++) {
      headEls[i].style.transform = headTransform;
      headEls[i].style.opacity = breathOpacity.toFixed(3);
    }

    // HAIR MICRO-SWAY — each sub-group gets an independent slow rotation
    // (additive to head's tilt because hair groups are children of #hair-strands,
    // which is in headEls; their style.transform overrides parent's)
    for (i = 0; i < hairEls.length; i++) {
      var phaseOffset = i * 1.6;                   // different phase per group
      var sway = 0.9 * Math.sin((t + phaseOffset) * 0.5); // ±0.9°, ~13s cycle
      // We compose hair's transform manually — head rotation + hair sway + breath scale
      hairEls[i].style.transform =
        'scale(' + breathScale.toFixed(5) + ') ' +
        'rotate(' + (currentTilt + sway).toFixed(3) + 'deg)';
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
